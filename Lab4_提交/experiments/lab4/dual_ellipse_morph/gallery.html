<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab4 · 双椭圆约束形态学</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#173348;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1380px;margin:auto;padding:24px}h1{margin:0;font-size:28px}.muted{color:#5b7183}.card{margin:15px 0;padding:15px;background:#fff;border:1px solid #d6e0e8;border-radius:10px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,button{font:inherit;padding:7px 10px;border:1px solid #adc0d0;border-radius:6px;background:white;color:inherit}img{display:block;width:100%;background:#202b34;border-radius:7px}a{color:#087f91}.metrics{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:9px}.metrics div{padding:9px 11px;background:#f4f8fa;border-radius:7px}.metrics b{display:block;font-size:19px}.good{color:#087758}.bad{color:#b34834}pre{white-space:pre-wrap;font-size:12px}@media(max-width:760px){main{padding:12px}.metrics{grid-template-columns:repeat(2,1fr)}}
</style>
<main><h1>双椭圆约束的形态学处理</h1>
<p class="muted">以 Lab3 最大块填孔结果为输入；绿色内椭圆提供高可信种子，蓝色外椭圆限制扩张。正中、左偏、右偏候选只根据图像信息选择，验证标签在预测固定后才用于评价。</p>
<div class="card" id="summary"></div>
<div class="card controls"><label>筛选 <select id="filter"><option value="all">全部</option><option value="improved">比 Lab3 提升</option><option value="declined">比 Lab3 下降</option><option value="relaxed">放宽门槛相关配对</option><option value="fallback">无双眼，回退 Lab3</option><option value="shifted">选择了侧向候选</option></select></label><button id="prev">上一张</button><select id="image"></select><button id="next">下一张</button><a id="open" target="_blank">打开总览原图</a></div>
<div class="card"><h2 id="title"></h2><div class="metrics" id="metrics"></div><p id="detail" class="muted"></p></div>
<img id="board" alt="八图总览">
<div class="card"><b>图册说明</b><p>第 5 幅只保留与内椭圆相交的肤色连通块；第 6 幅是在内区较强闭运算、过渡区较弱闭运算后的最终结果。外椭圆以外不能新增像素。找不到双眼时，第 6 幅与 Lab3 相同。</p><p>误差图中绿色为正确人脸区域，红色为误检，蓝色为漏检，黄色为眼镜等忽略区。“理论最佳候选”使用了标签，只表示三个候选还有多少选择空间，不属于实际方法。</p><details><summary>参数与汇总</summary><pre id="settings"></pre></details></div></main>
<script>
const DATA=__DATA__,$=id=>document.getElementById(id);let shown=[];const fmt=v=>v==null?'—':Number(v).toFixed(3),pct=v=>v==null?'—':(100*v).toFixed(1)+'%';
const s=DATA.summary,m=s.metrics,b=m.lab3.global,f=m.final.global,o=m.oracle.global;$('summary').innerHTML=`<b>${s.images} 张验证图：标准双眼 ${s.pair_statuses.standard_pair||0}，严格失败后由放宽规则恢复 ${s.pair_statuses.recovered_pair||0}，无双眼回退 ${s.pair_statuses.no_pair||0}</b><br>整体 F1：Lab3 ${fmt(b.f1)} → 实际双椭圆 ${fmt(f.f1)}；Precision ${fmt(b.precision)} → ${fmt(f.precision)}；Recall ${fmt(b.recall)} → ${fmt(f.recall)}。<br><span class="muted">逐图 ${s.image_comparison.improved_over_lab3} 张提升、${s.image_comparison.declined_from_lab3} 张下降，平均 F1 变化 ${s.image_comparison.mean_image_f1_delta>=0?'+':''}${fmt(s.image_comparison.mean_image_f1_delta)}。若事后用标签挑三个候选，理论上限 F1 ${fmt(o.f1)}。</span>`;$('settings').textContent=JSON.stringify({config:DATA.config,summary:s},null,2);
function delta(r){return r.metrics.final.f1-r.metrics.lab3.f1}function refresh(){const filter=$('filter').value,old=$('image').value;shown=DATA.records.filter(r=>filter==='all'||filter==='improved'&&delta(r)>0||filter==='declined'&&delta(r)<0||filter==='relaxed'&&r.pair_status==='recovered_pair'||filter==='fallback'&&r.pair_status==='no_pair'||filter==='shifted'&&['image_left','image_right'].includes(r.selected_candidate));$('image').innerHTML=shown.map(r=>`<option value="${r.id}">${r.id} · ${r.selected_candidate}</option>`).join('');if(shown.some(r=>r.id===old))$('image').value=old;load()}
function load(){const r=shown.find(x=>x.id===$('image').value);if(!r){$('title').textContent='没有符合条件的图片';$('metrics').innerHTML='';$('detail').textContent='';$('board').removeAttribute('src');return}const d=delta(r),base=`assets/${r.id}/`;$('title').textContent=`${r.id} · ${r.pair_status} · 实际选择 ${r.selected_candidate}`;$('board').src=base+'overview.jpg';$('open').href=base+'overview.jpg';const a=r.metrics.lab3,z=r.metrics.final;$('metrics').innerHTML=[['Lab3 F1',a.f1],['最终 F1',z.f1],['F1 变化',d],['最终 Precision',z.precision],['最终 Recall',z.recall]].map(([n,v],i)=>`<div><span>${n}</span><b class="${i===2?(v>=0?'good':'bad'):''}">${i===2&&v>=0?'+':''}${fmt(v)}</b></div>`).join('');$('detail').textContent=`实际候选 ${r.selected_candidate}；标签事后显示的最佳候选 ${r.oracle_candidate_display_only}。相对 Lab3：新增正确 ${r.changes_from_lab3.added_tp}，新增错误 ${r.changes_from_lab3.added_fp}，删除正确 ${r.changes_from_lab3.removed_tp}，删除错误 ${r.changes_from_lab3.removed_fp} 个像素。`}
function move(step){if(!shown.length)return;const i=shown.findIndex(r=>r.id===$('image').value);$('image').value=shown[(i+step+shown.length)%shown.length].id;load()}$('filter').onchange=refresh;$('image').onchange=load;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);refresh();
</script></html>
