[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-pixel-recognize"
version = "0.5.0"
description = "Color-based face segmentation and evaluation experiment"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "opencv-python-headless>=4.8", "matplotlib>=3.7"]

[project.scripts]
face-pixel = "face_pixel.experiment:main"
face-pixel-prepare = "face_pixel.dataset:main"
face-pixel-fit = "face_pixel.modeling:main"
face-pixel-evaluate = "face_pixel.cli:main"
face-pixel-demo = "face_pixel.demo:main"
face-pixel-visualize = "face_pixel.visualization:main"

[tool.setuptools.packages.find]
where = ["src"]
