<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab4 验证集 · 眼睛定位</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#183046;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1500px;margin:auto;padding:24px}h1{margin:0;font-size:27px}h2{font-size:18px;margin:0}p{margin:8px 0}.muted{color:#587084}.card,figure{background:white;border:1px solid #d9e2eb;border-radius:10px;padding:15px}.card{margin:14px 0}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select,button,input{font:inherit;padding:7px;border:1px solid #b4c5d4;border-radius:5px;background:white;color:inherit}input{width:115px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}figure{margin:0;padding:10px}figcaption{font-weight:600;margin-bottom:8px}figure img,canvas{width:100%;display:block;background:#18252f;aspect-ratio:1}a{color:#087f91}pre{white-space:pre-wrap;font-size:13px}.good{color:#087758}.bad{color:#b34834}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
<main><h1>眼睛定位：黑帽响应 → 暗部候选 → 左右配对</h1>
<p class="muted">固定验证集，未使用预训练检测器。首选由图像信息自动排序；标签仅用于结果对照。当前不接入椭圆和后续修整。</p>
<div class="card" id="summary"></div>
<div class="card controls"><label>筛选 <select id="filter"><option value="all">全部图像</option><option value="hit">首选误差 ≤ 0.25</option><option value="miss">首选误差 > 0.25 / 无配对</option><option value="unlabeled">缺少双眼标签</option></select></label><input id="search" placeholder="图像编号"><button id="prev">上一张</button><select id="image"></select><button id="next">下一张</button></div>
<div class="card"><h2 id="title"></h2><p id="metrics"></p><div class="controls"><label>配对 <select id="pair"></select></label><label>候选来源 <select id="roi"></select></label><label><input type="checkbox" id="truth" checked style="width:auto">叠加标签中心</label><a id="board" target="_blank">查看六图总览</a></div><p id="details" class="muted"></p></div>
<div class="grid">
<figure><figcaption>1 · 原图与当前配对（红圈）</figcaption><canvas id="prediction" width="512" height="512"></canvas></figure>
<figure><figcaption>2 · 灰度图</figcaption><img id="gray"></figure>
<figure><figcaption>3 · 黑帽响应（显示放大 3 倍）</figcaption><img id="blackhat"></figure>
<figure><figcaption>4 · 阈值后的暗部（白色）</figcaption><img id="binary"></figure>
<figure><figcaption>5 · 形状筛选后的候选与编号</figcaption><img id="candidates"></figure>
<figure><figcaption>6 · 肤色阈值结果（只用来产生搜索框）</figcaption><img id="skin"></figure>
</div><div class="card"><p>黄色框为当前眼部搜索范围；青色框为眼睛候选；红圈为预测中心；绿十字为标签区域的质心。候选来源可切换面积前三块产生的搜索框。太小的框跳过并说明原因。</p>
<p>误差 e = 两只眼睛中较大的定位距离 ÷ 标签双眼间距。0.15 与 0.25 是本次诊断阈值，不是眼睛像素分割 IoU。前五配对和候选覆盖率用于区分“没找到眼睛”与“排序选错”，不能算成自动首选准确率。</p>
<details><summary>本次参数与全部汇总</summary><pre id="settings"></pre></details></div></main>
<script>
const DATA=__DATA__;
const $=id=>document.getElementById(id);let filtered=[],record=null,loadSerial=0;
const fmt=v=>v==null?'—':v.toFixed(3);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const s=DATA.summary,n=s.two_eye_label_images,h=s.localization['0.25'];
$('summary').innerHTML=`<b>${s.images} 张验证图 · ${s.images_with_pair} 张产生配对</b><br>双眼标签齐全 ${n} 张：首选误差 ≤ 0.25 为 ${h.selected_pair_hits}/${n}；前五包含合格配对 ${h.top5_contains_hit}/${n}；两眼附近均有暗部候选 ${h.both_eye_candidates_available}/${n}。<br><span class="muted">严格阈值 0.15：首选 ${s.localization['0.15'].selected_pair_hits}/${n}。缺少双眼标签 ${s.missing_eye_label_images} 张，不计入上述定位分母。</span>`;
$('settings').textContent=JSON.stringify({config:DATA.config,summary:s},null,2);
function refreshList(){const old=$('image').value,q=$('search').value.trim(),f=$('filter').value;filtered=DATA.records.filter(r=>{const e=r.evaluation,hit=e.status==='ok'&&e.selected_error!=null&&e.selected_error<=.25;return r.id.includes(q)&&(f==='all'||f==='hit'&&hit||f==='miss'&&e.status==='ok'&&!hit||f==='unlabeled'&&e.status!=='ok')});$('image').innerHTML=filtered.map(r=>`<option value="${esc(r.id)}">${esc(r.id)}</option>`).join('');if(filtered.some(r=>r.id===old))$('image').value=old;loadRecord()}
function loadRecord(){record=filtered.find(r=>r.id===$('image').value);if(!record){$('title').textContent='没有匹配图像';$('metrics').textContent='';$('details').textContent='';$('pair').innerHTML='';$('roi').innerHTML='';loadSerial++;for(const id of ['gray','skin','blackhat','binary','candidates'])$(id).removeAttribute('src');$('prediction').getContext('2d').clearRect(0,0,512,512);$('board').removeAttribute('href');return}const base=`assets/${record.id}/`;$('title').textContent=record.id;$('gray').src=base+'gray.png';$('skin').src=base+'skin.png';$('board').href=base+'overview.jpg';const e=record.evaluation;$('metrics').textContent=`自动首选误差：${fmt(e.selected_error)}；前五最小误差（事后诊断）：${fmt(e.top5_best_error)}。${e.status==='ok'?'':'标签不全，仅做直观检查。'}`;
$('pair').innerHTML=record.pairs.length?record.pairs.map((p,i)=>`<option value="${i}">${i===0?'自动首选':'备选 '+(i+1)} · ${p.roi_id} · 分数 ${fmt(p.score)} · 误差 ${fmt(p.normalized_error)}</option>`).join(''):'<option value="-1">没有合适配对</option>';
$('roi').innerHTML=record.regions.map(r=>`<option value="${r.id}">${r.id} · 面积第 ${r.id.slice(1)} 块${r.status==='ok'?'':' · 框太小，跳过'}</option>`).join('');if(record.pairs.length)$('roi').value=record.pairs[0].roi_id;renderRegion();drawPrediction()}
function renderRegion(){if(!record)return;const r=record.regions.find(r=>r.id===$('roi').value),base=`assets/${record.id}/`;if(!r||r.status!=='ok'){for(const id of ['blackhat','binary','candidates'])$(id).removeAttribute('src');$('details').textContent='该肤色碎片提供的搜索框过小，未运行眼睛定位。';return}$('blackhat').src=base+r.id+'-blackhat.png';$('binary').src=base+r.id+'-binary.png';$('candidates').src=base+r.id+'-candidates.jpg';$('details').textContent=`${r.id}：黑帽核 ${r.kernel.join('×')}；响应阈值 ${fmt(r.threshold)}；${r.candidates.length} 个暗部候选；${r.pair_count} 个通过几何筛选的配对。`}
function drawPrediction(){if(!record)return;const serial=++loadSerial,current=record,p=current.pairs[Number($('pair').value)],showTruth=$('truth').checked;const im=new Image();im.onload=()=>{if(serial!==loadSerial)return;const ctx=$('prediction').getContext('2d');ctx.drawImage(im,0,0,512,512);if(showTruth){ctx.strokeStyle='#32f032';ctx.lineWidth=2;for(const pt of current.evaluation.label_centers){if(!pt)continue;ctx.beginPath();ctx.moveTo(pt[0]-8,pt[1]);ctx.lineTo(pt[0]+8,pt[1]);ctx.moveTo(pt[0],pt[1]-8);ctx.lineTo(pt[0],pt[1]+8);ctx.stroke()}}if(p){ctx.strokeStyle='#ff5020';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(...p.centers[0]);ctx.lineTo(...p.centers[1]);ctx.stroke();for(const pt of p.centers){ctx.beginPath();ctx.arc(...pt,7,0,Math.PI*2);ctx.stroke()}}};im.src=`assets/${current.id}/original.jpg`}
$('filter').onchange=refreshList;$('search').oninput=refreshList;$('image').onchange=loadRecord;$('roi').onchange=renderRegion;$('truth').onchange=drawPrediction;$('pair').onchange=()=>{const p=record&&record.pairs[Number($('pair').value)];if(p){$('roi').value=p.roi_id;renderRegion()}drawPrediction()};function move(step){if(!filtered.length)return;const i=filtered.findIndex(r=>r.id===$('image').value);$('image').value=filtered[(i+step+filtered.length)%filtered.length].id;loadRecord()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);refreshList();
</script></html>
