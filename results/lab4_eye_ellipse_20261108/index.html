<h1>双眼位置生成脸部椭圆</h1>
<p class="muted">训练集统计双眼与脸部外形的比例；验证图先检测双眼，再生成椭圆。这里还没有修改肤色二值图，也没有加入形态学操作。</p>

  <b>六幅图怎样看</b>
  <p>前两幅是图像检测到的眼睛及其生成的椭圆；第三幅是椭圆二值区域；第四幅是完全不看当前图像、直接使用训练集平均眼位的对照；第五、六幅才使用验证标签，分别用于人工参考和误差分析。</p>
  <p>误差图：绿色为椭圆与真值重合，红色为椭圆多出的区域，蓝色为遗漏的人脸区域，黄色为眼镜等忽略区。找不到双眼时保留失败，不补画预测椭圆。</p>
