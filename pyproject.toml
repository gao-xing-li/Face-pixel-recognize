[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-pixel-recognize"
version = "0.1.0"
description = "Color-based skin segmentation: shared evaluation and experiment scaffold"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "Pillow>=10", "opencv-python-headless>=4.8,<5", "matplotlib>=3.7"]

[project.optional-dependencies]
detection = []

[project.scripts]
face-pixel-evaluate = "face_pixel.cli:main"
face-pixel-demo = "face_pixel.demo:main"
face-pixel-b = "face_pixel.validation:main"

[tool.setuptools.packages.find]
where = ["src"]
