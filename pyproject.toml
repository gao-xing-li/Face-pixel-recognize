[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-pixel-recognize"
version = "0.4.0"
description = "Color-based skin segmentation: shared evaluation and experiment scaffold"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
detection = ["opencv-python>=4.8", "matplotlib>=3.7"]
analysis = ["opencv-python-headless>=4.8,<5", "matplotlib>=3.7"]

[project.scripts]
face-pixel-evaluate = "face_pixel.cli:main"
face-pixel-demo = "face_pixel.demo:main"
face-pixel-prepare-part-a = "face_pixel.part_a:main"
face-pixel-test-part-b = "face_pixel.part_b:main"
face-pixel-visualize = "face_pixel.visualization:main"

[tool.setuptools.packages.find]
where = ["src"]
